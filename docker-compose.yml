services:
  registry:
    image: registry:2
    container_name: docker-registry
    ports:
      - "5000:5000"
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Docker Registry
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      REGISTRY_STORAGE_DELETE_ENABLED: true
      REGISTRY_STORAGE: s3
      REGISTRY_STORAGE_S3_BUCKET: ${S3_BUCKET:?}
      REGISTRY_STORAGE_S3_REGION: ${S3_REGION:?}
      REGISTRY_STORAGE_S3_ACCESSKEY: ${S3_ACCESS_KEY:?}
      REGISTRY_STORAGE_S3_SECRETKEY: ${S3_SECRET_KEY:?}
      REGISTRY_STORAGE_S3_REGIONENDPOINT: ${S3_ENDPOINT:?}
      REGISTRY_STORAGE_S3_FORCEPATHSTYLE: ${S3_FORCEPATHSTYLE:-true}
      REGISTRY_STORAGE_S3_SECURE: ${S3_SECURE:-true}
      REGISTRY_STORAGE_S3_ROOTDIRECTORY: ${S3_ROOTDIRECTORY:?}
    volumes:
      - ./auth:/auth
    restart: unless-stopped

  registry-ui:
    image: joxit/docker-registry-ui:latest
    container_name: registry-ui
    ports:
      - "3000:80"
    environment:
      SINGLE_REGISTRY: true
      REGISTRY_TITLE: My Docker Registry
      DELETE_IMAGES: true
      NGINX_PROXY_PASS_URL: http://registry:5000
      REGISTRY_SECURED: false
    depends_on:
      - registry
    restart: unless-stopped

  registry-gc:
    image: registry:2
    container_name: registry-gc
    profiles: ["tools"]
    entrypoint:
      [
        "registry",
        "garbage-collect",
        "--delete-untagged",
        "/etc/docker/registry/config.yml",
      ]
    environment:
      REGISTRY_STORAGE: s3
      REGISTRY_STORAGE_S3_BUCKET: ${S3_BUCKET:?}
      REGISTRY_STORAGE_S3_REGION: ${S3_REGION:?}
      REGISTRY_STORAGE_S3_ACCESSKEY: ${S3_ACCESS_KEY:?}
      REGISTRY_STORAGE_S3_SECRETKEY: ${S3_SECRET_KEY:?}
      REGISTRY_STORAGE_S3_REGIONENDPOINT: ${S3_ENDPOINT:?}
      REGISTRY_STORAGE_S3_FORCEPATHSTYLE: ${S3_FORCEPATHSTYLE:-true}
      REGISTRY_STORAGE_S3_SECURE: ${S3_SECURE:-true}
      REGISTRY_STORAGE_S3_ROOTDIRECTORY: ${S3_ROOTDIRECTORY:?}
