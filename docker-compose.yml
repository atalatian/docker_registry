services:
  registry:
    image: registry:2
    container_name: docker-registry
    ports:
      - "${REGISTRY_PORT:-5000}:5000"
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Docker Registry
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      REGISTRY_STORAGE_DELETE_ENABLED: true
      REGISTRY_STORAGE: s3
      REGISTRY_STORAGE_S3_BUCKET: ${S3_BUCKET:?}
      REGISTRY_STORAGE_S3_REGION: ${S3_REGION:?}
      REGISTRY_STORAGE_S3_ACCESSKEY: ${S3_ACCESS_KEY:?}
      REGISTRY_STORAGE_S3_SECRETKEY: ${S3_SECRET_KEY:?}
      REGISTRY_STORAGE_S3_REGIONENDPOINT: ${S3_ENDPOINT:?}
      REGISTRY_STORAGE_S3_FORCEPATHSTYLE: ${S3_FORCEPATHSTYLE:-true}
      REGISTRY_STORAGE_S3_SECURE: ${S3_SECURE:-true}
      REGISTRY_STORAGE_S3_ROOTDIRECTORY: ${S3_ROOTDIRECTORY:-/}
    volumes:
      - ./auth:/auth
    restart: unless-stopped

  registry-ui:
    image: joxit/docker-registry-ui:latest
    container_name: registry-ui
    ports:
      - "${UI_PORT:-3000}:80"
    environment:
      SINGLE_REGISTRY: true
      REGISTRY_TITLE: My Docker Registry
      DELETE_IMAGES: true
      NGINX_PROXY_PASS_URL: http://registry:5000
      REGISTRY_SECURED: false
    depends_on:
      - registry
    restart: unless-stopped

  registry-gc:
    image: registry:2
    container_name: registry-gc
    profiles: ["tools"]
    entrypoint:
      [
        "registry",
        "garbage-collect",
        "--delete-untagged",
        "/etc/docker/registry/config.yml",
      ]
    environment:
      REGISTRY_STORAGE: s3
      REGISTRY_STORAGE_S3_BUCKET: ${S3_BUCKET:?}
      REGISTRY_STORAGE_S3_REGION: ${S3_REGION:?}
      REGISTRY_STORAGE_S3_ACCESSKEY: ${S3_ACCESS_KEY:?}
      REGISTRY_STORAGE_S3_SECRETKEY: ${S3_SECRET_KEY:?}
      REGISTRY_STORAGE_S3_REGIONENDPOINT: ${S3_ENDPOINT:?}
      REGISTRY_STORAGE_S3_FORCEPATHSTYLE: ${S3_FORCEPATHSTYLE:-true}
      REGISTRY_STORAGE_S3_SECURE: ${S3_SECURE:-true}
      REGISTRY_STORAGE_S3_ROOTDIRECTORY: ${S3_ROOTDIRECTORY:-/}

  image-copy:
    image: gcr.io/go-containerregistry/crane:debug
    container_name: registry-image-copy
    profiles: ["tools"]
    environment:
      - SRC_REGISTRY
      - SRC_INSECURE=${SRC_INSECURE:-}
      - SRC_IMAGE
      - SRC_TAG
      - SRC_USER=${SRC_USER:-}
      - SRC_PASSWORD=${SRC_PASSWORD:-}
      - DST_REGISTRY
      - DST_INSECURE=${DST_INSECURE:-}
      - DST_USER=${DST_USER:-}
      - DST_PASSWORD=${DST_PASSWORD:-}
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e

        : "$${SRC_REGISTRY:?SRC_REGISTRY is required but not set}"
        : "$${SRC_IMAGE:?SRC_IMAGE is required but not set}"
        : "$${SRC_TAG:?SRC_TAG is required but not set}"
        : "$${DST_REGISTRY:?DST_REGISTRY is required but not set}"

        if [ -n "$$SRC_USER" ]; then
          echo "Logging in to $$SRC_REGISTRY"
          crane auth login "$$SRC_REGISTRY" -u "$$SRC_USER" -p "$$SRC_PASSWORD" $$SRC_INSECURE
        fi

        if [ -n "$$DST_USER" ]; then
          echo "Logging in to $$DST_REGISTRY"
          crane auth login "$$DST_REGISTRY" -u "$$DST_USER" -p "$$DST_PASSWORD" $$DST_INSECURE
        fi

        echo "Copying $$SRC_IMAGE:$$SRC_TAG from $$SRC_REGISTRY to $$DST_REGISTRY"

        crane copy $$SRC_INSECURE \
          "$$SRC_REGISTRY/$$SRC_IMAGE:$$SRC_TAG" \
          "$$DST_REGISTRY/$$SRC_IMAGE:$$SRC_TAG"
    restart: "no"

  image-auto-sync:
    image: ghcr.io/regclient/regsync:latest
    container_name: registry-image-auto-sync
    environment:
      SRC_REGISTRY: "${SRC_REGISTRY:?}"
      SRC_TLS: "${SRC_TLS:-enabled}"
      SRC_USER: "${SRC_USER:-}"
      SRC_PASSWORD: "${SRC_PASSWORD:-}"
      DST_REGISTRY: "${DST_REGISTRY:?}"
      DST_TLS: "${DST_TLS:-enabled}"
      DST_USER: "${DST_USER:-}"
      DST_PASSWORD: "${DST_PASSWORD:-}"
      COPY_INTERVAL: "${COPY_INTERVAL:-3600s}"
    volumes:
      - ./regsync/regsync.yaml.template:/home/appuser/regsync.yaml:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e

        exec regsync -c /home/appuser/regsync.yaml server
    restart: unless-stopped
